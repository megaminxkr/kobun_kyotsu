name: Site checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test content, search, state and links
        run: npm run check
      - name: Check generated files are up to date
        run: git diff --exit-code -- index.html lessons assets/search-index.json .nojekyll
      - name: Install browser testing tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser regression checks
        run: node scripts/browser-check.mjs
